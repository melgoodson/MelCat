# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9d1a6f6c9b86fb97bdb5d1c2a6b63890"
name = "MelCat Dashboard"
application_url = "https://snarky-mel-cat-34130528345.northamerica-northeast2.run.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/refunds/create"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_metaobject_definitions,write_metaobjects,read_online_store_pages,write_online_store_pages,read_orders,read_products,write_products,read_all_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://snarky-mel-cat-34130528345.northamerica-northeast2.run.app/auth/callback"
]

[app_proxy]
url = "https://snarky-mel-cat-34130528345.northamerica-northeast2.run.app/proxy"
subpath = "snarky"
prefix = "apps"
